<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#120716">
    <title>Cubechat</title>
    <link rel="icon" href="/cube.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Cubechat">
          <img src="/cube.png" alt="" class="brand__logo">
          <div>
            <h1>Cubechat</h1>
            <p>anonymous real-time chat</p>
          </div>
        </div>
        <div class="topbar__right">
          <label class="theme-control">
            <span>Theme</span>
            <select id="themeSelect" aria-label="Theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="terminal">Terminal</option>
              <option value="dracula">Dracula</option>
            </select>
          </label>
        </div>
      </header>

      <main class="main-grid">
        <aside class="users-panel">
          <div class="panel-title">
            <span>Active</span>
            <strong id="userCount">0</strong>
          </div>
          <div id="currentUser" class="current-user"></div>
          <ul id="usersList" class="users-list" aria-label="Active users"></ul>
        </aside>

        <section class="chat-frame" aria-label="Global chat">
          <div class="chat-box">
            <div class="chat-header">
              <div>
                <span class="channel-kicker">global</span>
                <h2>The Cube</h2>
              </div>
              <div class="chat-header__meta">
                <span id="connectionStatus" class="status-pill">connecting</span>
              </div>
            </div>
            <div id="messages" class="messages" aria-live="polite"></div>
            <form id="messageForm" class="composer" autocomplete="off">
              <div class="input-shell">
                <span class="input-caret" aria-hidden="true"></span>
                <input id="messageInput" type="text" maxlength="1000" placeholder="Send a message into the cube..." aria-label="Message">
              </div>
              <button type="submit">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <section id="dmPanel" class="dm-panel" aria-label="Direct messages" hidden>
      <div class="dm-header">
        <div>
          <span class="channel-kicker">direct</span>
          <h2 id="dmTitle">DM</h2>
        </div>
        <button id="closeDm" class="icon-button" type="button" aria-label="Close direct messages">×</button>
      </div>
      <p class="dm-policy">Unviewed DMs are discarded on disconnect. Viewed DMs expire after 24 hours.</p>
      <div id="dmMessages" class="dm-messages"></div>
      <form id="dmForm" class="composer composer--dm" autocomplete="off">
        <div class="input-shell">
          <span class="input-caret" aria-hidden="true"></span>
          <input id="dmInput" type="text" maxlength="1000" placeholder="Whisper to this session..." aria-label="Direct message">
        </div>
        <button type="submit">Send</button>
      </form>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
